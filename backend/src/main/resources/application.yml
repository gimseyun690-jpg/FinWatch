spring:
  application:
    name: finwatch-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finwatch}
    username: ${DB_USERNAME:finwatch}
    password: ${DB_PASSWORD:finwatch-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/postgresql-migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    jwt-secret: ${JWT_SECRET:finwatch-local-jwt-secret-change-before-production-2026}
    issuer: ${JWT_ISSUER:finwatch-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    demo-users-enabled: ${DEMO_USERS_ENABLED:true}
    demo-user-password: ${DEMO_USER_PASSWORD:FinWatch123!}
    demo-admin-password: ${DEMO_ADMIN_PASSWORD:FinWatchAdmin123!}
  ai:
    provider: ${AI_PROVIDER:mock}
    prompt-version: ${AI_PROMPT_VERSION:news-analysis-v2}
    cache-ttl: ${AI_CACHE_TTL:24h}
    max-segment-characters: ${AI_MAX_SEGMENT_CHARACTERS:1800}
    max-segments: ${AI_MAX_SEGMENTS:4}
    input-price-per-million: ${AI_INPUT_PRICE_PER_MILLION:0.25}
    output-price-per-million: ${AI_OUTPUT_PRICE_PER_MILLION:1.50}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  news-content:
    user-agent: ${ARTICLE_USER_AGENT:}
    connect-timeout: ${ARTICLE_CONNECT_TIMEOUT:2s}
    read-timeout: ${ARTICLE_READ_TIMEOUT:5s}
    max-response-bytes: ${ARTICLE_MAX_RESPONSE_BYTES:1048576}
    max-redirects: ${ARTICLE_MAX_REDIRECTS:3}
    opendart-api-key: ${OPENDART_API_KEY:}
    opendart-max-archive-entries: ${OPENDART_MAX_ARCHIVE_ENTRIES:50}
    opendart-max-uncompressed-bytes: ${OPENDART_MAX_UNCOMPRESSED_BYTES:4194304}
    configured-policies: []
