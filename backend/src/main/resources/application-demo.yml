spring:
  datasource:
    url: jdbc:h2:mem:finwatch;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    locations: classpath:db/migration
app:
  ai:
    requests-per-minute: 100
