name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test backend, Flyway and infrastructure boundaries
        working-directory: backend
        run: ./gradlew test --no-daemon --max-workers=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint and production build
        working-directory: frontend
        run: pnpm lint && pnpm build
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Route, mobile and PWA tests
        working-directory: frontend
        run: pnpm test:e2e && pnpm test:pwa
      - name: Scan tracked files and browser bundle for secret signatures
        run: bash scripts/security/check-secrets.sh

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build SHA-addressable images
        run: |
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" --build-arg VCS_REF="${GITHUB_SHA}" -f backend/Dockerfile -t finwatch-backend:${GITHUB_SHA} .
          docker build --build-arg APP_VERSION="${GITHUB_SHA}" --build-arg VCS_REF="${GITHUB_SHA}" -f frontend/Dockerfile -t finwatch-frontend:${GITHUB_SHA} .
      - name: Verify non-root and health metadata
        run: |
          test "$(docker image inspect finwatch-backend:${GITHUB_SHA} --format '{{.Config.User}}')" = '10001:10001'
          test -n "$(docker image inspect finwatch-backend:${GITHUB_SHA} --format '{{json .Config.Healthcheck}}')"
          test -n "$(docker image inspect finwatch-frontend:${GITHUB_SHA} --format '{{.Config.User}}')"
          test -n "$(docker image inspect finwatch-frontend:${GITHUB_SHA} --format '{{json .Config.Healthcheck}}')"
