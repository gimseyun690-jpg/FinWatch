name: Get Backend logs from AWS

on:
  workflow_dispatch:
    inputs:
      log_group:
        description: 'Log group name'
        required: true
        default: '/finwatch/app'
      limit:
        description: 'Number of logs to fetch'
        required: true
        default: '50'

permissions:
  id-token: write
  contents: read

jobs:
  get-logs:
    runs-on: ubuntu-latest
    environment: portfolio
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: finwatch-logs-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Fetch CloudWatch Logs
        run: |
          aws logs filter-log-events \
            --log-group-name "${{ github.event.inputs.log_group }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --filter-pattern "ERROR" \
            --query "events[*].[timestamp, message]" \
            --output text > logs.txt
          cat logs.txt
