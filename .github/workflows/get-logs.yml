name: Get Backend logs from AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  get-logs:
    runs-on: ubuntu-latest
    environment: portfolio
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: finwatch-logs-${{ github.run_id }}

      - name: Run logs query via SSM
        run: |
          command="docker compose -f /opt/finwatch/current/deploy/compose.portfolio.yml --env-file /opt/finwatch/current/compose.env logs --tail 200 backend 2>&1"
          jq -n --arg command "$command" '{commands:[$command]}' > ssm-parameters.json
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://ssm-parameters.json --comment "Fetch logs" --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
