name: finwatch-production-like

services:
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        APP_VERSION: local-smoke
        VCS_REF: local
    ports:
      - "4180:8080"
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /tmp/no-templates
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: local-smoke
        VCS_REF: local
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/finwatch
      DB_USERNAME: finwatch
      DB_PASSWORD: finwatch-local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: finwatch-production-like-redis
      APP_PUBLIC_BASE_URL: http://localhost:4180
      FRONTEND_BASE_URL: http://localhost:4180
      CORS_ALLOWED_ORIGINS: http://localhost:4180
      JWT_SECRET: finwatch-production-like-jwt-secret-change-before-release-2026
      SESSION_COOKIE_SECURE: "false"
      DATA_MODE: DEMO
      AI_PROVIDER: mock
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: finwatch-production-like-redis
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    expose:
      - "6379"
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
