AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege GitHub Actions OIDC deployment role for FinWatch.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing arn:aws:iam::<account>:oidc-provider/token.actions.githubusercontent.com.
  GitHubOwner:
    Type: String
    Default: gimseyun690-jpg
  GitHubRepository:
    Type: String
    Default: FinWatch
  GitHubEnvironment:
    Type: String
    Default: portfolio
  ProjectName:
    Type: String
    Default: finwatch
  EnvironmentName:
    Type: String
    Default: portfolio
  DeploymentBucketName:
    Type: String

Resources:
  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-github-deploy'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: finwatch-release-and-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrReleaseImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeImageScanFindings
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:StartImageScan
                  - ecr:UploadLayerPart
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-backend'
                  - !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ProjectName}-frontend'
              - Sid: PublishDeploymentBundle
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DeploymentBucketName}/releases/*'
              - Sid: SnapshotApplicationDatabase
                Effect: Allow
                Action: [rds:CreateDBSnapshot, rds:AddTagsToResource]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:${ProjectName}-${EnvironmentName}'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:${ProjectName}-${EnvironmentName}-deploy-*'
              - Sid: WaitForDatabaseSnapshot
                Effect: Allow
                Action: rds:DescribeDBSnapshots
                Resource: '*'
              - Sid: UseRunShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
              - Sid: DeployOnlyTaggedFinWatchInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: FinWatch
                    ssm:resourceTag/Environment: !Ref EnvironmentName
                    ssm:resourceTag/SsmDeployTarget: 'true'
              - Sid: ReadCommandResult
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations, ssm:ListCommands]
                Resource: '*'
      Tags:
        - {Key: Project, Value: FinWatch}
        - {Key: Environment, Value: !Ref EnvironmentName}

Outputs:
  RoleArn:
    Value: !GetAtt GitHubDeploymentRole.Arn
  TrustedSubject:
    Value: !Sub 'repo:${GitHubOwner}/${GitHubRepository}:environment:${GitHubEnvironment}'
